  d.staff=d.staff.map((x,i)=>Object.assign(x,{name:(s.staff[i]&&s.staff[i].name)||'',no:(s.staff[i]&&s.staff[i].no)||'',photo:(s.staff[i]&&s.staff[i].photo)||''}));
  const c=s.contact||{};
  d.contact={name:c.name||'',phone:c.phone||'',email:c.email||''};
  d.locked=!!s.locked;d.submittedAt=s.submittedAt||'';
  d.players=d.players.map((x,i)=>Object.assign(x,s.players[i]?{name:s.players[i].name||'',birth:s.players[i].birth||'',h:s.players[i].h||'',w:s.players[i].w||'',photo:s.players[i].photo||''}:{}));
  return d;
}
function loadDraft(){
  try{const r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r));}catch(e){}
  return null;
}
let saveTimer;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(state));}
    catch(e){toast('照片太多，瀏覽器無法自動暫存。請用「匯出草稿」保存進度。');}
  },500);
}

/* ---------- helpers ---------- */
function roc(iso){
  if(!iso)return '';
  const [y,m,d]=iso.split('-');
  return (+y-1911)+'/'+m+'/'+d;
}
const digits=v=>String(v||'').replace(/\D/g,'');
const PHONE_RE=/^09\d{8}$/, EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function contactErrors(c){
  const a=[];
  if(!c.name.trim())a.push('請輸入聯絡人姓名');
  if(!PHONE_RE.test(digits(c.phone)))a.push('行動電話請輸入 09 開頭的 10 碼號碼');
  if(!EMAIL_RE.test(c.email.trim()))a.push('Email 格式不正確');
  return a;
}
function mode(){
  if(contactErrors(state.contact).length)return 'contact';
  if(state.locked&&!unlocked)return 'locked';
  return 'edit';
}
function issues(p){
  const a=[];
  if(!p.name)a.push('缺姓名');
  if(!p.photo)a.push('缺照片');
  if(!p.birth||!p.h||!p.w)a.push('缺生日／身高／體重');
  return a;
}
function readImage(file,w,h){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');
        x.fillStyle='#fff';x.fillRect(0,0,w,h);
        const r=Math.max(w/img.width,h/img.height),sw=w/r,sh=h/r;
        x.drawImage(img,(img.width-sw)/2,(img.height-sh)*0.25,sw,sh,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.86));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

/* ---------- sheet rendering ---------- */
const PLACEHOLDER='<svg viewBox="0 0 50 57" xmlns="http://www.w3.org/2000/svg"><rect width="50" height="57" fill="#E6EAEE"/><circle cx="25" cy="22" r="9" fill="#B9C2CC"/><path d="M7 57c0-13 8-20 18-20s18 7 18 20z" fill="#B9C2CC"/></svg>';
const phHtml=src=>src?`<img src="${src}" alt="">`:PLACEHOLDER;

function cellHtml(p,i){
  return `<div class="cell"><div class="ph">${phHtml(p.photo)}</div><div class="nm">${esc(p.name)}</div><div class="info">
<div><b>背號(NO)</b><span>${i+1}</span></div>
<div><b>年齡(AGE)</b><span>${roc(p.birth)}</span></div>
<div><b>身高(cm)</b><span>${esc(p.h)}</span></div>
<div><b>體重(KG)</b><span>${esc(p.w)}</span></div></div></div>`;
}
function staffCell(s){
  return `<div class="cell"><div class="ph">${phHtml(s.photo)}</div><div class="stf">${s.title!=='領隊'&&s.no?`背號　${esc(s.no)}<br>`:''}${esc(s.title)}${s.name?'　'+esc(s.name):''}</div></div>`;
}
function sheetHtml(style,seal){
  const e=state.event;
  return `<div class="sheet" ${style?`style="${style}"`:''}>
<div class="s-head"><div class="s-title">${TITLE}</div></div><div class="s-stitch"></div>
<div class="s-team">${esc(e.county)}${e.county&&e.school?'　':''}${esc(e.school)}</div>
<div class="s-grid staff">${state.staff.map(staffCell).join('')}</div>
<div class="s-grid">${state.players.map(cellHtml).join('')}</div>
${seal?`<div class="s-seal">${['總教練','體育組長','主任','校長'].map(t=>`<div><b>${t}</b><span></span></div>`).join('')}</div>`:''}</div>`;
}
function renderPreview(){
  const box=$('#preview');
  const s=Math.min(1,Math.max(280,box.clientWidth-40)/PAGE_W);
  box.innerHTML=`<div class="pv-note">預覽依 A4 直式排版，一頁包含 4 位隊職員與 ${PLAYER_COUNT} 位球員。</div>
<figure class="pw"><div class="pw-box" style="width:${PAGE_W*s}px;height:${PAGE_H*s}px">${sheetHtml(`transform:scale(${s})`)}</div>
<figcaption><span>A4 直式</span></figcaption></figure>`;
}

/* ---------- editor rendering ---------- */
function fld(label,inner){return `<label class="fld"><span>${label}</span>${inner}</label>`;}
function photoPick(kind,src){
  return `<div class="photo-pick"><div class="thumb">${src?`<img src="${src}" alt="">`:'無照片'}</div>
<span class="btn sm filebtn">選擇照片<input type="file" accept="image/*" data-file="${kind}"></span>
${src?`<button class="btn sm" data-act="clear-photo">移除</button>`:''}</div>`;
}
function playerHead(p,i){
  const iss=issues(p);
  return `<div class="thumb">${p.photo?`<img src="${p.photo}" alt="">`:(i+1)}</div>
<div class="t"><b>${i+1} 號　${esc(p.name)||'未填姓名'}</b><br>
${iss.length?iss.map(x=>`<span class="badge">${x}</span>`).join(''):'<span class="badge ok">資料完整</span>'}</div>`;
}
function playerBody(p){
  return `<div class="pl-body">
${photoPick('photo-p',p.photo)}
${fld('姓名',`<input data-f="name" value="${esc(p.name)}" autocomplete="off">`)}
${fld('出生日期（西元選取，輸出為民國年）',`<input type="date" data-f="birth" value="${esc(p.birth)}">`)}
<div class="row2">${fld('身高 (cm)',`<input data-f="h" value="${esc(p.h)}" inputmode="numeric" maxlength="3">`)}${fld('體重 (KG)',`<input data-f="w" value="${esc(p.w)}" inputmode="numeric" maxlength="3">`)}</div></div>`;
}
function renderGate(){
  const c=state.contact;
  return `<div class="panel"><form class="gate" data-gate="contact" novalidate>
<h2>聯絡人資料</h2>
<p class="lead">開始填寫報名表前，請先輸入聯絡人資料。日後如需修改已完成的報名表，須輸入相同的聯絡人姓名與行動電話。</p>
${fld('聯絡人姓名',`<input name="name" value="${esc(c.name)}" autocomplete="name" required>`)}
${fld('行動電話',`<input name="phone" value="${esc(c.phone)}" type="tel" inputmode="numeric" maxlength="12" placeholder="0912345678" autocomplete="tel" required>`)}
${fld('Email',`<input name="email" value="${esc(c.email)}" type="email" placeholder="name@example.com" autocomplete="email" required>`)}
<div class="err" role="alert"></div>
<button class="btn primary" type="submit">開始填寫</button></form></div>`;
}
function renderLock(){
  return `<div class="panel"><form class="gate" data-gate="unlock" novalidate>
<h2>報名表已完成</h2>
<p class="lead">${state.submittedAt?`已於 ${esc(state.submittedAt)} 完成報名。`:''}如需修改，請輸入報名時填寫的聯絡人姓名與行動電話。</p>
${fld('聯絡人姓名',`<input name="name" autocomplete="off" required>`)}
${fld('行動電話',`<input name="phone" type="tel" inputmode="numeric" maxlength="12" autocomplete="off" required>`)}
<div class="err" role="alert"></div>
<button class="btn primary" type="submit">進入修改</button></form></div>`;
}
function syncTop(){
  const m=mode(),b=$('#btnSubmit');
  b.hidden=m!=='edit';
  b.textContent=state.locked?'更新報名':'完成報名';
}
function renderEditor(){
  const ed=$('#editor');
  syncTop();
  const m=mode();
  if(m==='contact'){ed.innerHTML=renderGate();return;}
  if(m==='locked'){ed.innerHTML=renderLock();return;}
  let h=`<div class="tabs" role="tablist">
<button class="tab" role="tab" data-tab="team" aria-selected="${tab==='team'}">參賽隊伍與職員</button>
<button class="tab" role="tab" data-tab="players" aria-selected="${tab==='players'}">球員（${PLAYER_COUNT}）</button></div><div class="panel">`;
  if(tab==='team'){
    const e=state.event;
    const c=state.contact;
    h+=`${state.locked?`<div class="locked-note">此報名表已完成報名，修改後請按上方「更新報名」。</div>`:''}
<h2>聯絡人</h2><div class="contact-box">
${fld('聯絡人姓名',`<input data-c="name" value="${esc(c.name)}" autocomplete="name">`)}
<div class="row2">${fld('行動電話',`<input data-c="phone" value="${esc(c.phone)}" type="tel" inputmode="numeric" maxlength="12" autocomplete="tel">`)}${fld('Email',`<input data-c="email" value="${esc(c.email)}" type="email" autocomplete="email">`)}</div></div>
<h2>參賽隊伍</h2>
<div class="row2">${fld('縣市',`<select data-e="county"><option value="">請選擇縣市</option>${COUNTIES.map(c=>`<option ${c===e.county?'selected':''}>${c}</option>`).join('')}</select>`)}
${fld('學校名稱',`<select data-school-sel ${e.county?'':'disabled'}><option value="">${e.county?'請選擇學校':'請先選擇縣市'}</option>${schoolList(e.county).map(([n,t])=>`<option value="${esc(n)}" ${!schoolCustom&&n===e.school?'selected':''}>${esc(n)}</option>`).join('')}${e.county?`<option value="__other__" ${schoolCustom?'selected':''}>其他（自行輸入）</option>`:''}</select>`)}</div>
${schoolCustom?fld('自行輸入學校名稱',`<input data-e="school" value="${esc(e.school)}" placeholder="例如：○○國小" autocomplete="off">`):''}
<p class="hint">學校選單為 114 學年度學生棒球聯賽國小軟式組、硬式組報名學校；名單中沒有的學校請選「其他」自行輸入。</p>
<h2>隊職員</h2>`;
    state.staff.forEach((s,i)=>{
      h+=`<article class="pl open" data-s="${i}"><div class="pl-body" style="border-top:0">
<div class="staff-title">${s.title}${STAFF_TITLES.filter(t=>t===s.title).length>1?'（'+(i-STAFF_TITLES.indexOf(s.title)+1)+'）':''}</div>
${photoPick('photo-s',s.photo)}
${s.title==='領隊'?fld('姓名',`<input data-sf="name" value="${esc(s.name)}" autocomplete="off">`):`<div class="row2">${fld('姓名',`<input data-sf="name" value="${esc(s.name)}" autocomplete="off">`)}${fld('背號',`<input data-sf="no" value="${esc(s.no)}" inputmode="numeric" maxlength="3" autocomplete="off">`)}</div>`}</div></article>`;
    });
  }else{
    const bad=state.players.filter(p=>issues(p).length).length;
    h+=`<div class="summary">背號固定為 1 至 ${PLAYER_COUNT} 號。${bad?`<span class="badge">${bad} 位待補資料</span>`:'<span class="badge ok">資料完整</span>'}</div>`;
    state.players.forEach((p,i)=>{
      const open=i===openIdx;
      h+=`<article class="pl ${open?'open':''}" data-p="${i}"><button class="pl-head" data-act="toggle" aria-expanded="${open}">${playerHead(p,i)}</button>${open?playerBody(p):''}</article>`;
    });
  }
  h+='</div>';
  ed.innerHTML=h;
}
function rerender(){renderEditor();renderPreview();persist();}

/* ---------- editor events ---------- */
const ed=$('#editor');
ed.addEventListener('input',e=>{
  const t=e.target;
  const pa=t.closest('[data-p]'), sa=t.closest('[data-s]');
  if(t.dataset.c){state.contact[t.dataset.c]=t.value;persist();return;}
  if(t.dataset.e){state.event[t.dataset.e]=t.value;}
  else if(t.dataset.f&&pa){
    const i=+pa.dataset.p;state.players[i][t.dataset.f]=t.value;
    pa.querySelector('.pl-head').innerHTML=playerHead(state.players[i],i);
  }else if(t.dataset.sf&&sa){state.staff[+sa.dataset.s][t.dataset.sf]=t.value;}
  else return;
  renderPreview();persist();
});
ed.addEventListener('change',e=>{
  const t=e.target;
  if(t.tagName==='SELECT'&&t.dataset.e==='county'){
    state.event.county=t.value;
    if(!schoolCustom&&!inList(t.value,state.event.school))state.event.school='';
    renderEditor();renderPreview();persist();return;
  }
  if(t.hasAttribute('data-school-sel')){
    if(t.value==='__other__'){
      schoolCustom=true;state.event.school='';renderEditor();renderPreview();persist();
      const inp=ed.querySelector('input[data-e="school"]');if(inp)inp.focus();
    }else{schoolCustom=false;state.event.school=t.value;renderEditor();renderPreview();persist();}
    return;
  }
  if(t.dataset.file&&t.files&&t.files[0]){
    const kind=t.dataset.file;
    const pa=t.closest('[data-p]'),sa=t.closest('[data-s]');
    readImage(t.files[0],336,384).then(url=>{
      if(kind==='photo-p'&&pa)state.players[+pa.dataset.p].photo=url;
      else if(kind==='photo-s'&&sa)state.staff[+sa.dataset.s].photo=url;
      rerender();
    }).catch(()=>toast('無法讀取這張圖片，請換一張 JPG 或 PNG。'));
  }
});
ed.addEventListener('submit',e=>{
  const f=e.target.closest('[data-gate]');if(!f)return;
  e.preventDefault();
  const v=n=>f.elements[n].value;
  const err=f.querySelector('.err');
  if(f.dataset.gate==='contact'){
    const c={name:v('name').trim(),phone:digits(v('phone')),email:v('email').trim()};
    const errs=contactErrors(c);
    if(errs.length){err.textContent=errs[0];return;}
    state.contact=c;rerender();
  }else{
    const c=state.contact;
    if(v('name').trim()===c.name.trim()&&digits(v('phone'))===digits(c.phone)){
      unlocked=true;renderEditor();toast('已進入修改模式');
    }else err.textContent='聯絡人姓名或行動電話不符，請重新輸入。';
  }
});
ed.addEventListener('focusout',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.c)return;
  const errs=contactErrors(state.contact);
  if(errs.length)toast(errs[0]);
});
const armed=new WeakMap();
function confirmTwice(btn,label){
  if(armed.get(btn)){armed.delete(btn);return true;}
  armed.set(btn,true);const old=btn.textContent;btn.textContent=label;btn.classList.add('armed');
  setTimeout(()=>{armed.delete(btn);btn.textContent=old;btn.classList.remove('armed');},3000);
  return false;
}
ed.addEventListener('click',e=>{
  const tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){tab=tabBtn.dataset.tab;renderEditor();return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const pa=b.closest('[data-p]'),sa=b.closest('[data-s]');
  const i=pa?+pa.dataset.p:sa?+sa.dataset.s:-1;
  if(b.dataset.act==='toggle'){openIdx=(openIdx===i?-1:i);renderEditor();}
  else if(b.dataset.act==='clear-photo'){
    if(pa)state.players[i].photo='';else if(sa)state.staff[i].photo='';rerender();
  }
});

/* ---------- top actions ---------- */
async function saveFile(filename,data){
  let d=null;
  try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){}
  if(d){
    try{await d.save({filename,data});toast('已儲存 '+filename);}
    catch(err){if(err&&err.code!=='declined')toast('下載失敗：'+(err.message||err.code));}
    return;
  }
  try{
    const url=URL.createObjectURL(data);
    const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    toast('已下載 '+filename);
  }catch(err){toast('下載失敗：'+(err.message||err));}
}
async function capture(seal){
  if(typeof html2canvas==='undefined')throw new Error('匯出元件尚未載入，請稍後再試。');
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;width:'+PAGE_W+'px;';
  host.innerHTML=seal?sheetHtml('--cw:96px',true):sheetHtml('');
  document.body.appendChild(host);
  try{return await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',logging:false});}
  finally{host.remove();}
}
const fname=ext=>TITLE+'_'+(state.event.school||'學校')+ext;

async function buildPdf(seal){
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
  const c=await capture(seal);
  pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
  return pdf;
}
async function uploadPdf(){
  const pdf=await buildPdf(false);
  const e=state.event,c=state.contact;
  const payload={county:e.county,school:e.school,contact:{name:c.name,phone:digits(c.phone),email:c.email},pdf:pdf.output('datauristring').split(',')[1]};
  let j;
  if(GAS){
    j=await new Promise((res,rej)=>GAS.withSuccessHandler(res).withFailureHandler(rej).savePdf(payload));
  }else{
    const res=await fetch(UPLOAD_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    j=await res.json();
  }
  if(!j)throw new Error('上傳失敗');
  if(!j.ok)throw new Error(j.error||'上傳失敗');
  return j.name;
}
async function makePdf(btnSel,seal){
  const btn=$(btnSel);btn.disabled=true;const old=btn.textContent;btn.textContent='產生中…';
  try{
    const pdf=await buildPdf(seal);
    await saveFile(fname(seal?'_核章.pdf':'.pdf'),pdf.output('blob'));
  }catch(err){toast(err.message||'PDF 產生失敗');}
  finally{btn.disabled=false;btn.textContent=old;}
}
$('#btnSubmit').addEventListener('click',async e=>{
  const btn=e.currentTarget;
  const errs=contactErrors(state.contact);
  if(errs.length){tab='team';renderEditor();toast(errs[0]);return;}
  if(!state.event.county||!state.event.school){tab='team';renderEditor();toast('請先選擇縣市與學校');return;}
  const bad=state.players.filter(p=>issues(p).length).length;
  if(bad&&!confirmTwice(btn,`${bad} 位資料未完整，再按一次確認`))return;
  if(GAS||UPLOAD_URL){
    const old=btn.textContent;btn.disabled=true;btn.textContent='上傳中…';
    try{await uploadPdf();}
    catch(err){toast('報名表上傳失敗，請稍後再按一次：'+(err.message||err));return;}
    finally{btn.disabled=false;btn.textContent=old;}
  }
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  state.locked=true;
  state.submittedAt=`${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
  unlocked=false;
  rerender();
  toast(GAS||UPLOAD_URL?'已完成報名，報名表已上傳至主辦單位。':'已完成報名，請下載 PDF 送交主辦單位。');
});
$('#btnPdf').addEventListener('click',()=>makePdf('#btnPdf',false));
$('#btnSeal').addEventListener('click',()=>makePdf('#btnSeal',true));
/* ---------- init ---------- */
let rt;
new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(renderPreview,80);}).observe($('#preview'));
renderEditor();renderPreview();
})();
</script>
